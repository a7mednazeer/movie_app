name: movie_app
description: "A premium, production-ready Flutter movie discovery application."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  #Splash Screen
  flutter_native_splash: ^2.4.7
  
  #Localizations
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.3.2

  # Navigation
  go_router: ^17.3.0

  # Firebase (Auth + Firestore for per-account cloud sync)
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0

  # Networking
  dio: ^5.4.3+1
  connectivity_plus: ^7.3.0

  # Functional error handling
  dartz: ^0.10.1
  equatable: ^2.0.5

  # Local storage / caching
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI / UX
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  google_fonts: ^8.2.0
  smooth_page_indicator: ^2.0.1

  # Utilities
  # NOTE: flutter_localizations (SDK) pins its own `intl` version tightly.
  # If `flutter pub get` reports a version conflict here, delete this line
  # and let flutter_localizations resolve `intl` itself.
  intl: ^0.20.2
  logger: ^2.3.0
  url_launcher: ^6.3.0
  share_plus: ^13.2.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# Run `dart run flutter_launcher_icons` after `flutter pub get` to generate
# the real per-platform launcher icons from assets/icon/app_icon.png.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#E8A33D"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true # runs `flutter gen-l10n` (see l10n.yaml) to build AppLocalizations

  assets:
    - assets/images/
    - assets/posters/
    - assets/icons/
    - assets/icon/

  # Uncomment and add real font files later.
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
